[workspace]
members = [
    "crates/core",
    "crates/ops",
    "crates/server",
    "crates/cli",
]
resolver = "3"

[workspace.package]
version = "0.11.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
xboct-log-core = { path = "crates/core" }
xboct-log-ops = { path = "crates/ops" }
xboct-log-server = { path = "crates/server" }
libsqlite3-sys = { version = "=0.37.0", default-features = false, features = ["bundled"] }
icu_casemap = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
icu_locale_core = "2.4.0"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros", "migrate", "json", "uuid", "chrono"] }
clap = { version = "4.6.8", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
sha2 = "0.10.9"
regex = "1.12.2"
uuid = { version = "1.18.1", features = ["v4", "v7"] }
serde = { version = "1.0.229", features = ["derive"] }
schemars = { version = "1.2.3", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
thiserror = "2.0.21"
async-trait = "0.1.92"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "fs", "time", "net", "signal"] }
axum = "0.8.9"
tower-http = "0.7.1"
tower = "0.5.3"
mime_guess = "2"
rmcp = { version = "=3.9.0", features = ["server", "transport-streamable-http-server"] }
base64 = "0.23.1"
tracing = "0.1.41"
tracing-subscriber = "0.3.23"
async-stream = "0.3.6"
futures-util = "0.3.34"
