name: Checks

on:
  workflow_call:
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Use ui-kit from GitHub
        run: node scripts/use-kit-from-github.mjs

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Refresh ui-kit
        run: pnpm update @ku6epxboctuk/ui-kit

      - name: Lint
        run: pnpm lint

      - name: Check
        run: pnpm check

      - name: Test
        run: pnpm test
