name: Release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия без префикса, например 0.1.0"
        required: true

permissions:
  contents: write

env:
  KIT_VERSION: "0.1.0"

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $raw = if ("${{ inputs.version }}") { "${{ inputs.version }}" } else { "${{ github.ref_name }}" }
          $version = $raw -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "cannot resolve a version from '$raw'" }
          $app = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($app -ne $version) { throw "package.json has $app, expected $version" }
          $ext = (Get-Content vscode-extension/package.json -Raw | ConvertFrom-Json).version
          if ($ext -ne $version) { throw "vscode-extension/package.json has $ext, expected $version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Use published ui-kit
        run: node scripts/use-published-kit.mjs $env:KIT_VERSION

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Package Windows bundle and installer
        run:
          pwsh -File scripts/package-win.ps1 -Version ${{
          steps.version.outputs.version }} -SkipBuild -Installer

      - name: Build extension
        run: |
          npm --prefix vscode-extension install --no-audit --no-fund --no-package-lock
          npm --prefix vscode-extension run compile
          Push-Location vscode-extension
          npx vsce package --no-dependencies --out "../dist/xboct-log-vscode-${{ steps.version.outputs.version }}.vsix"
          Pop-Location

      - name: Create GitHub Release
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -like "*$version*" } | Select-Object -ExpandProperty FullName
          if (-not $files) { throw "no release artifacts in dist" }
          gh release create "v$version" --title "Xboct Log $version" --generate-notes @files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
